name: intelligent-qa-optimized
services:
  mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: qa-opt-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    volumes:
      - qa_mysql_data:/var/lib/mysql
      - ./.secrets/mysql-init.sql:/docker-entrypoint-initdb.d/01-qa-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
secrets:
  mysql_root_password:
    file: ./.secrets/mysql-root-password
volumes:
  qa_mysql_data:
